name: exercises

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-exercises:
    name: Run solution exercises
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run solutions
        run: |
          for f in solutions/*.py; do
            echo "== $f =="
            python "$f"
          done
